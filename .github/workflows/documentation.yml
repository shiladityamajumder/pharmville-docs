name: Documentation quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:validator
      - run: npm run test:database-source
      - name: Verify supplied database source
        if: ${{ hashFiles('healthcare_db/postgresql/migrations/V*.sql') != '' }}
        run: npm run validate:database
      - run: npm run validate:erd
      - run: npm run validate:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-validation
          path: artifacts/
