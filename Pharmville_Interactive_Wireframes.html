ius:12px;padding:17px;margin:10px 0}.issue-card h3{font-size:13px;margin:0 0 12px}.issue-grid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}.issue-grid b{font-size:10px;color:#9aa5b1;text-transform:uppercase;letter-spacing:.08em}.issue-grid p{font-size:12px;margin:6px 0 0;color:#4c5b6d}.chip{font-size:10px;border-radius:5px;background:#eef2f5;padding:4px 7px;color:#607187}.handoffs{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.handoff{border:1px solid #dde5ec;background:white;border-radius:12px;padding:18px}.handoff b{display:block;font-size:12px;margin-bottom:7px}.handoff p{font-size:11px;color:#778796}.empty{padding:35px;color:#8793a0;text-align:center}.focus-title{font-size:12px;color:#8c9bab}.footer{font-size:11px;color:#95a1ad;padding:24px 30px}.hidden{display:none!important} @media(max-width:1200px){.workspace{grid-template-columns:1fr}.library-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.sidebar{width:100%;height:auto;position:static;display:block;border-right:0;border-bottom:1px solid #e2e8ef;padding:14px}.sidebar .nav-zone{display:flex;overflow:auto}.sidebar .nav-btn{width:auto;white-space:nowrap}.sidebar .scenario-zone{display:none}.shell{display:block}.topbar{padding:12px 18px}.content{padding:17px}.intro{display:block}.intro h1{font-size:23px}.metrics{margin-top:13px}.library-grid{grid-template-columns:1fr 1fr}.wire{padding:9px}.mock-body{padding:12px}.mock-layout{grid-template-columns:104px 1fr}.mock-side{padding:9px 5px}.mock-side div{font-size:9px}.issue-grid{grid-template-columns:1fr}.handoffs{grid-template-columns:1fr 1fr}} @media(max-width:540px){.library-grid{grid-template-columns:1fr}.mock-nav{display:none}.ui-grid,.ui-grid.two,.two-col{grid-template-columns:1fr}.mock{min-height:400px}.mock-layout{grid-template-columns:1fr}.mock-side{display:none}.topbar .pill{display:none}}</style></head><body><div class="shell"><aside class="sidebar"><div class="logo"><span class="mark">+</span> Pharmville</div><div class="sub">Product Wireframe Studio • v1.0</div><div class="nav-zone"><button class="nav-btn active" data-view="journey"><span class="nav-number">01</span> Guided journeys</button><button class="nav-btn" data-view="library"><span class="nav-number">02</span> 60 screens</button><button class="nav-btn" data-view="issues"><span class="nav-number">03</span> What could go wrong?</button><button class="nav-btn" data-view="handoffs"><span class="nav-number">04</span> Team handoffs</button><button class="nav-btn" data-view="about"><span class="nav-number">05</span> How to review</button></div><div class="scenario-zone"><div class="side-label">Guided examples</div><button class="scenario-btn" data-scenario="T1">M + O: no prescription<small>Everyday checkout without pharmacist review</small></button><button class="scenario-btn" data-scenario="T2">P medicine approved<small>Upload, review, payment, store, rider</small></button><button class="scenario-btn" data-scenario="T3">P + M + O mixed basket<small>Only P goes to pharmacist</small></button><button class="scenario-btn" data-scenario="T4">One P product rejected<small>Customer approves revised basket; M/O remains</small></button><button class="scenario-btn" data-scenario="T5">Prescription image unclear<small>Correct the file, then review again</small></button><button class="scenario-btn" data-scenario="T6">Payment outcome unknown<small>Verify before asking customer to pay again</small></button><button class="scenario-btn" data-scenario="T7">Stock missing at store<small>Pause, find permitted stock, obtain customer acceptance</small></button><button class="scenario-btn" data-scenario="T8">Customer cancels<small>Handle eligibility, stop fulfilment, issue refund</small></button><button class="scenario-btn" data-scenario="T9">Delivery attempt fails<small>Record reason and reschedule or return parcel</small></button><button class="scenario-btn" data-scenario="T10">Return and refund<small>Check eligibility, inspect and refund correctly</small></button><button class="scenario-btn" data-scenario="T11">Warehouse restocking<small>Request, approve, dispatch, receive and reconcile</small></button><button class="scenario-btn" data-scenario="T12">End-of-day money check<small>Cash, settlements, refunds and unmatched payments</small></button></div></aside><main class="main"><div class="topbar"><span class="crumb">Pharmville / <strong id="crumb">Guided journeys</strong></span><span class="pill">OFFLINE · FUNCTIONAL WIREFRAMES · NOT A LIVE SERVICE</span></div><div class="content" id="app"></div><div class="footer">PHARMVILLE · Planning artifact. Source: Complete Order Journey v3.0 + approved P/M/O rule. Other business policies are proposed until confirmed.</div></main></div><script>const SCREENS=[{"id":"CUS01","title":"Home & categories","area":"Customer Website & Account","role":"CUS","states":["S01"],"purpose":"Help shoppers start with a category or search.","action":"Search products","next":["CUS02"],"pattern":"discovery","sections":["Deliver to: Choose location","Search medicines & essentials","Popular: Medicines / Personal Care / Devices","Recently viewed / Shop by category"],"notes":"","edge_cases":[{"state":"S01","trigger":"Unknown query / spelling","response":"Offer close matches and spelling suggestions. Do not change a medicine strength automatically.","destination":"Find the right product"},{"state":"S01","trigger":"No service-area selected","response":"Allow browsing, but ask for an address before promising that an item can be delivered.","destination":"Find the right product"},{"state":"S01","trigger":"Blocked / recalled SKU","response":"Remove the Buy option. Tell the customer the item cannot be ordered and offer help.","destination":"Find the right product"}]},{"id":"CUS02","title":"Search results","area":"Customer Website & Account","role":"CUS","states":["S01"],"purpose":"Show relevant exact products, not unsafe automatic substitutions.","action":"Open product","next":["CUS03"],"pattern":"catalogue","sections":["Search: paracetamol","Filters: Type / Brand / Price / Availability","Product results with pack size and P/M/O badge","No results: try a different name or spelling"],"notes":"","edge_cases":[{"state":"S01","trigger":"Unknown query / spelling","response":"Offer close matches and spelling suggestions. Do not change a medicine strength automatically.","destination":"Find the right product"},{"state":"S01","trigger":"No service-area selected","response":"Allow browsing, but ask for an address before promising that an item can be delivered.","destination":"Find the right product"},{"state":"S01","trigger":"Blocked / recalled SKU","response":"Remove the Buy option. Tell the customer the item cannot be ordered and offer help.","destination":"Find the right product"}]},{"id":"CUS03","title":"Product details","area":"Customer Website & Account","role":"CUS","states":["S02"],"purpose":"Help the shopper verify strength, pack, class, cost and serviceability.","action":"Add to cart","next":["CUS04"],"pattern":"product","sections":["Product image placeholder and product title","Strength / form / pack / manufacturer","Price, availability, delivery location","P label if prescription is required"],"notes":"","edge_cases":[{"state":"S02","trigger":"P type changed mid-session","response":"Refresh the product label before adding it to the cart. If it is now P, require a prescription later.","destination":"Build one shopping cart"},{"state":"S02","trigger":"Price differs from search results","response":"Show the current price plainly and let the customer decide whether to continue.","destination":"Understand the item"},{"state":"S02","trigger":"No purchasable stock","response":"Disable Add to cart and offer a stock alert or other safely listed products.","destination":"Understand the item"}]},{"id":"CUS04","title":"Shopping cart","area":"Customer Website & Account","role":"CUS","states":["S03"],"purpose":"Keep P, M and O in one basket with labels only where needed.","action":"Proceed to checkout","next":["CUS05"],"pattern":"cart","sections":["P medicine  • Prescription required","M medicine  • No prescription required","O personal care  • No prescription","Quantity + remove controls / estimated total"],"notes":"","edge_cases":[{"state":"S03","trigger":"Duplicate rapid Add taps","response":"Count the repeated tap only once so the quantity is not doubled by mistake.","destination":"Build one shopping cart"},{"state":"S03","trigger":"P removed; no P remains","response":"Remove the prescription step from this checkout. Keep the remaining M/O items.","destination":"Build one shopping cart"},{"state":"S03","trigger":"Different patient for P lines","response":"Ask the customer to place separate P orders for different patients.","destination":"Log in and choose patient when needed"},{"state":"S03","trigger":"Invalid max quantity / restricted pack","response":"Explain the allowed quantity and ask the customer to choose an acceptable number.","destination":"Build one shopping cart"}]},{"id":"CUS05","title":"Sign in with OTP","area":"Customer Website & Account","role":"CUS","states":["S05"],"purpose":"Identify the customer once and return to the same cart.","action":"Verify OTP","next":["CUS06"],"pattern":"form","sections":["Phone number input","Send OTP / resend after countdown","6-digit verification code","Continue existing cart on successful sign-in"],"notes":"","edge_cases":[{"state":"S05","trigger":"OTP delayed / delivery failed","response":"Show a resend option after a short wait and offer another approved OTP channel.","destination":"Log in and choose patient when needed"},{"state":"S05","trigger":"Phone used by existing account","response":"Sign the customer into the existing account and bring the cart across without doubling items.","destination":"Log in and choose patient when needed"},{"state":"S05","trigger":"Dependent wrong / age mismatch","response":"Ask the customer to select or correct the patient before using the prescription.","destination":"Log in and choose patient when needed"},{"state":"S05","trigger":"M/O-only basket","response":"Skip the family-patient questions and continue with ordinary checkout.","destination":"Confirm what will actually be ordered"}]},{"id":"CUS06","title":"Delivery address","area":"Customer Website & Account","role":"CUS","states":["S04"],"purpose":"Confirm the exact delivery address can be served.","action":"Save address","next":["CUS07","CUS12"],"pattern":"address","sections":["Saved addresses / Add new","Name, number, address, landmark","PIN code and delivery zone check","Serviceable status and estimated fee"],"notes":"","edge_cases":[{"state":"S04","trigger":"Pincode supported, exact address outside zone","response":"Explain that this exact address falls outside the delivery route, even if the PIN code is covered.","destination":"Check the delivery address"},{"state":"S04","trigger":"Map unavailable / permission denied","response":"Let the customer type the address and landmark without using the phone’s location.","destination":"Check the delivery address"},{"state":"S04","trigger":"Address changed after quote","response":"Check delivery fees, store availability and timing again before showing the final total.","destination":"Confirm what will actually be ordered"}]},{"id":"CUS07","title":"Select patient (P only)","area":"Customer Website & Account","role":"CUS","states":["S05"],"purpose":"Connect P medicine to the correct patient or family member.","action":"Select patient","next":["CUS08"],"pattern":"form","sections":["This step appears only if the basket has P","Self / saved family member","Patient name and age (when needed)","One P patient per order in phase 1"],"notes":"","edge_cases":[{"state":"S05","trigger":"OTP delayed / delivery failed","response":"Show a resend option after a short wait and offer another approved OTP channel.","destination":"Log in and choose patient when needed"},{"state":"S05","trigger":"Phone used by existing acco reports","area":"Finance, Returns & Support","role":"FIN","states":["S26","S31","S32"],"purpose":"Reconcile payment provider payouts with billed orders.","action":"Export report","next":["FIN01"],"pattern":"table","sections":["Settlement date and provider reference","Invoice / refund / credit note records","Matched / Unmatched totals","Export authorized report"],"notes":"","edge_cases":[{"state":"S26","trigger":"Rider submits proof twice","response":"Keep one delivery confirmation, even if the rider submits proof again.","destination":"Finish delivery and provide documents"},{"state":"S26","trigger":"Customer says not received","response":"Open an urgent delivery investigation and check the handover evidence.","destination":"Investigate an unusual problem"},{"state":"S26","trigger":"Late success after RTO confirmed","response":"Flag contradictory updates for investigation; do not rewrite a confirmed return as delivered automatically.","destination":"Investigate an unusual problem"},{"state":"S26","trigger":"Incorrect delivered quantity","response":"Open a missing-item case and check the pack and handover records.","destination":"Raise a return, wrong item or quality complaint; Investigate an unusual problem"},{"state":"S31","trigger":"Payment processor refund webhook delayed","response":"Show Refund processing and verify the result before claiming the money has arrived.","destination":"Return the correct money once"},{"state":"S31","trigger":"Duplicate refund instruction","response":"Ignore repeated refund instructions; no more than the eligible amount is returned.","destination":"Return the correct money once"},{"state":"S31","trigger":"Partial P rejection before payment","response":"If rejected P was never charged, remove it from the final price. No refund is needed for unpaid items.","destination":"Approve a changed basket; Choose payment with stock briefly held"},{"state":"S31","trigger":"COD refund lacks validated destination","response":"Ask the customer to provide an approved, verified destination for returning COD money.","destination":"Return the correct money once"},{"state":"S32","trigger":"Settlement differs from gross due to fees","response":"Explain payment-provider fees separately during internal reconciliation; do not adjust the customer invoice silently.","destination":"Close the order records"},{"state":"S32","trigger":"Rider COD deposited short","response":"Flag the cash shortage, investigate with the rider and keep a clear collection record.","destination":"Investigate an unusual problem"},{"state":"S32","trigger":"Refund later reversed by processor","response":"Open a new finance investigation without erasing the earlier refund entry.","destination":"Investigate an unusual problem"}]},{"id":"FIN07","title":"Returns & customer support","area":"Finance, Returns & Support","role":"FIN","states":["S27","S29","S30","S33","S34"],"purpose":"Handle complaints, returns and safety escalations with a clear owner.","action":"Resolve request","next":["FIN04","ADM06"],"pattern":"support","sections":["Open ticket, customer concern and affected line","Return eligibility and evidence","Pickup / inspection / safety hold decision","Reply / escalate / refund after approval"],"notes":"","edge_cases":[{"state":"S27","trigger":"Customer reschedules outside service hours","response":"Offer an allowed time slot or explain when delivery is next possible.","destination":"Handle a failed delivery"},{"state":"S27","trigger":"Parcel lost on way back","response":"Open a parcel-loss case and record who last held it.","destination":"Investigate an unusual problem"},{"state":"S27","trigger":"COD marked collected but delivery failed","response":"Check the cash record immediately; failed delivery should not quietly create a COD receipt.","destination":"Investigate an unusual problem"},{"state":"S27","trigger":"P product returned after failed handover","response":"Keep returned P items away from saleable stock until the pharmacy follows its safety checks.","destination":"Stop unsafe products immediately; Close the order records"},{"state":"S29","trigger":"Customer asks to return non-returnable medicine","response":"Explain that ordinary returns may not apply to medicines; offer help for damage, wrong items or safety concerns.","destination":"Investigate an unusual problem"},{"state":"S29","trigger":"Wrong P SKU delivered","response":"Treat delivery of the wrong P medicine as urgent and involve pharmacy quality immediately.","destination":"Stop unsafe products immediately"},{"state":"S29","trigger":"Return period exceeded but manufacturing defect","response":"Even outside the normal window, send a credible defect or safety complaint for review.","destination":"Investigate an unusual problem"},{"state":"S29","trigger":"Multiple return claims for same line","response":"Link the request to the existing case instead of creating duplicate refunds.","destination":"Raise a return, wrong item or quality complaint"},{"state":"S30","trigger":"Return courier loses parcel","response":"Investigate with the delivery partner and keep the return request open while custody is checked.","destination":"Investigate an unusual problem"},{"state":"S30","trigger":"Returned product used or tampered","response":"Photograph and record the condition; do not put questionable products back into saleable stock.","destination":"Investigate an unusual problem; Stop unsafe products immediately"},{"state":"S30","trigger":"Wrong lot scanned on receipt","response":"Check the lot and product against the original order before deciding the refund.","destination":"Receive and inspect returned items"},{"state":"S30","trigger":"Non-P non-sensitive item returnable","response":"Apply the published return policy and return eligible money once inspection is complete.","destination":"Close the order records"},{"state":"S33","trigger":"Support agent attempts P approval","response":"Support must hand clinical questions to a qualified pharmacist; support cannot approve a prescription.","destination":"Review only the P medicines"},{"state":"S33","trigger":"Manual refund exceeds threshold","response":"Send unusually large refunds to an authorised approver and record the decision.","destination":"Return the correct money once"},{"state":"S33","trigger":"Customer contacts multiple channels","response":"Link WhatsApp, calls and tickets to one case so the customer receives one consistent answer.","destination":"Investigate an unusual problem"},{"state":"S33","trigger":"Stuck state for hours","response":"Assign an owner and deadline for orders that have stopped moving; update the customer.","destination":"Investigate an unusual problem"},{"state":"S34","trigger":"Recall arrives while rider en route","response":"Stop the rider before handover and return the parcel for a safety check.","destination":"Handle a failed delivery; Stop unsafe products immediately"},{"state":"S34","trigger":"Affected lot already delivered","response":"Identify the affected orders by batch and contact customers through an approved pharmacy-led process.","destination":"Investigate an unusual problem; Stop unsafe products immediately"},{"state":"S34","trigger":"Non-affected items in mixed basket","response":"Assess whether safe items may continue. Ask for customer agreement before changing the rest of the order.","destination":"Approve a changed basket; Resolve a stock or delivery problem"},{"state":"S34","trigger":"Quality user tries to clear with no evidence","response":"Keep the block in place until a qualified, authorised person records the decision and evidence.","destination":"Stop unsafe products immediately"}]}],STATES=[{"id":"S01","name":"Find the right product","role":"Customer","summary":"The customer searches, browses categories, or opens a previously ordered item. Only products that Pharmville is allowed to sell are shown.","screen":"Products, pack sizes, prices and a clear Prescription required label on P items.","system":"Keep the product list current and do not show recalled or blocked items as available.","next":"The customer opens a product.","edges":[["Unknown query / spelling","Offer close matches and spelling suggestions. Do not change a medicine strength automatically.","Find the right product"],["No service-area selected","Allow browsing, but ask for an address before promising that an item can be delivered.","Find the right product"],["Blocked / recalled SKU","Remove the Buy option. Tell the customer the item cannot be ordered and offer help.","Find the right product"]]},{"id":"S02","name":"Understand the item","role":"Customer","summary":"Before buying, the customer checks the exact brand, strength, size, quantity and price. Product type is checked again before it enters the cart.","screen":"Product details and delivery availability. P shows Prescription required; M shows No prescription needed; O shows normal shopping information.","system":"Keep different strengths and pack sizes separate. Never quietly replace one medicine with another.","next":"The customer adds an available item to the cart.","edges":[["P type changed mid-session","Refresh the product label before adding it to the cart. If it is now P, require a prescription later.","Build one shopping cart"],["Price differs from search results","Show the current price plainly and let the customer decide whether to continue.","Understand the item"],["No purchasable stock","Disable Add to cart and offer a stock alert or other safely listed products.","Understand the item"]]},{"id":"S03","name":"Build one shopping cart","role":"Customer","summary":"The customer adds P, M and O items together, changes quantities or removes products. The cart clearly identifies which lines need a prescription.","screen":"Items, quantities, prices and an easy-to-see notice beside each P item.","system":"Keep cart changes consistent; if all P items are removed, the prescription step must disappear.","next":"The customer chooses Checkout.","edges":[["Duplicate rapid Add taps","Count the repeated tap only once so the quantity is not doubled by mistake.","Build one shopping cart"],["P removed; no P remains","Remove the prescription step from this checkout. Keep the remaining M/O items.","Build one shopping cart"],["Different patient for P lines","Ask the customer to place separate P orders for different patients.","Log in and choose patient when needed"],["Invalid max quantity / restricted pack","Explain the allowed quantity and ask the customer to choose an acceptable number.","Build one shopping cart"]]},{"id":"S04","name":"Check the delivery address","role":"Customer","summary":"The customer chooses or enters the exact delivery location. A valid PIN code by itself does not guarantee that a particular building is serviceable.","screen":"Supported/not-supported delivery result, fees and an estimated window.","system":"Confirm coverage and whether an eligible store can deliver to that address.","next":"A valid serviceable address is chosen.","edges":[["Pincode supported, exact address outside zone","Explain that this exact address falls outside the delivery route, even if the PIN code is covered.","Check the delivery address"],["Map unavailable / permission denied","Let the customer type the address and landmark without using the phone’s location.","Check the delivery address"],["Address changed after quote","Check delivery fees, store availability and timing again before showing the final total.","Confirm what will actually be ordered"]]},{"id":"S05","name":"Log in and choose patient when needed","role":"Customer","summary":"The customer signs in using an OTP. Patient selection appears only if the cart contains P products. One order containing P items must refer to one patient under the proposed launch rule.","screen":"OTP screen and, only for P, a self/family-member choice.","system":"Keep patient details private and make sure the uploaded prescription belongs to the selected person.","next":"Sign-in and any required patient selection are complete.","edges":[["OTP delayed / delivery failed","Show a resend option after a short wait and offer another approved OTP channel.","Log in and choose patient when needed"],["Phone used by existing account","Sign the customer into the existing account and bring the cart across without doubling items.","Log in and choose patient when needed"],["Dependent wrong / age mismatch","Ask the customer to select or correct the patient before using the prescription.","Log in and choose patient when needed"],["M/O-only basket","Skip the family-patient questions and continue with ordinary checkout.","Confirm what will actually be ordered"]]},{"id":"S06","name":"Confirm what will actually be ordered","role":"Customer / checkout team","summary":"Before creating the order, Pharmville checks prices, stock information, product category, quantities, fees and the delivery promise again.","screen":"A full order summary with final charges and notices about changed items or prices.","system":"Do not use an old price, delivery estimate or product category from a previous browser page.","next":"The customer accepts the current summary; P moves to upload, M/O skips it.","edges":[["P newly introduced by catalogue update","Treat the item as P and ask for patient details and a prescription before continuing.","Upload prescription only for P"],["P becomes M only after authoritative update","Use the newly approved product classification, explain the change and update the checkout.","Confirm what will actually be ordered"],["Offer expired / GST changed","Show the changed charges and ask the customer to accept them.","Confirm what will actually be ordered"],["Cart now empty due delisting","Explain that no order can be placed with an empty cart; do not charge.","Find the right product"]]},{"id":"S07","name":"Upload prescription only for P","role":"Customer","summary":"If at least one P item is still in the cart, the customer attaches a prescription for the selected patient. M and O items do not ask for a file.","screen":"Upload button, file preview, selected patient and P item list.","system":"Accept approved file types, check that the file opens safely, then link it to the correct patient.","next":"The file is ready for pharmacist review, or P items are removed.","edges":[["File corrupt / unreadable at upload","Explain that the file could not be opened and request another photo or document.","Upload prescription only for P"],["Upload for wrong patient","Ask the customer to select the correct patient and attach the matching prescription.","Upload prescription only for P"],["P line removed during upload","If no P item remains, stop the upload requirement and recheck the basket.","Confirm what will actually be ordered"],["Customer leaves upload","Save the unfinished checkout where permitted so the customer can return without being charged.","Upload prescription only for P"]]},{"id":"S08","name":"Record the order request once","role":"Pharmville system","summary":"Pharmville creates a single order request using the final cart, address and price. This step does not mean the medicines are approved, paid for or packed.","screen":"For P: Order received - prescription review next. For M/O: Continue to payment.","system":"Save the request even if the customer closes the browser. Repeated taps must not create new orders.","next":"P goes to pharmacist; a basket without P goes straight toward payment.","edges":[["Network timeout after submit","Look up the existing order request and show its status; do not create a second order.","Record the order request once"],["P added in a stale browser tab","Recheck the cart and show the updated prescription requirement before accepting the order.","Confirm what will actually be ordered"],["Customer closes browser","Keep the order request available under My Orders so the customer can continue later.","Review only the P medicines; Confirm the prescription step is complete"]]},{"id":"S09","name":"Review only the P medicines","role":"Pharmacist","summary":"The pharmacist checks the attached prescription, the patient and each P item. M and O items remain in the order but are not put in the pharmacist decision list.","screen":"Prescription under review, with a realistic wait message.","system":"Approve or reject each P item and record a clear reason where needed.","next":"All P accepted, correction requested, or the customer is offered a revised basket.","edges":[["Review queue unavailable","Keep P items waiting, alert the pharmacy team and do not release them to the store.","Review only the P medicines"],["Two pharmacists act simultaneously","Allow only one final pharmacist decision. Ask the other reviewer to refresh.","Review only the P medicines"],["Rx patient mismatch / unsigned / unclear","Explain what is missing or incorrect and request an updated prescription.","Fix a prescription problem"],["M/O items in mixed cart","Show M/O items for order context only; do not ask the pharmacist to approve them.","Review only the P medicines"]]},{"id":"S10","name":"Fix a prescription problem","role":"Customer / pharmacist","summary":"If the prescription image is unclear, belongs to the wrong person or lacks required information, the customer must fix it. P items stay on hold.","screen":"What needs correcting and options to Upload again, Remove P item or Contact support.","system":"Set a clear response deadline, keep M/O items unchanged and send the new file back for review.","next":"A corrected prescription is approved or the customer chooses to remove/cancel affected P.","edges":[["Customer uploads same corrupted file","Explain why the new file still cannot be read and offer practical photo guidance.","Fix a prescription problem"],["No response before deadline","When the stated deadline passes, offer removal of affected P items or cancellation; never charge without agreement.","Approve a changed basket"],["All P items are removed","Show the new M/O-only basket and ask the customer to approve it before continuing.","Approve a changed basket"],["Customer changes patient","Ask for a prescription for the newly selected patient and restart P review.","Upload prescription only for P"]]},{"id":"S11","name":"Approve a changed basket","role":"Customer","summary":"If some or all P items cannot be supplied, Pharmville shows the remaining items and a fresh total. No P item is silently removed from a paid order.","screen":"Before and after item lists, updated amount, delivery fee and options to Accept changes, Retry or Cancel.","system":"Retain M/O items and approved P items; do not charge until the customer accepts changes.","next":"A revised basket is accepted, corrected prescription is submitted, or order is cancelled.","edges":[["P-only order fully rejected","Offer a new prescription or cancellation. There is nothing eligible to ship until the P problem is resolved.","Fix a prescription problem; Cancel safely at the correct stage"],["Mixed P/M/O; one P rejected","Keep all M/O items, remove only rejected P items and display the new total for approval.","Approve a changed basket"],["Customer disputes decision","Open a support case or request a new pharmacist review, without letting support override the decision.","Investigate an unusual problem"],["Quote changes during approval","Show the newly calculated price and delivery details, then ask the customer to confirm again.","Confirm what will actually be ordered; Approve a changed basket"]]},{"id":"S12","name":"Confirm the prescription step is complete","role":"Pharmville system","summary":"There are two valid outcomes: remaining P items are approved, or the order has no P items and does not need pharmacist review.","screen":"P orders may show Prescription approved. M/O-only orders simply continue to payment.","system":"Make sure no unapproved P item can move into payment or picking.","next":"Customer moves to payment selection.","edges":[["P decision revoked or Rx version changed","Stop the P item and send it back for review before payment or picking.","Review only the P medicines"],["M/O-only cart mistakenly queued","Remove the accidental pharmacist task and let the M/O-only order continue.","Choose payment with stock briefly held"],["All P deleted just before payment","Recheck the final basket, remove the prescription requirement and confirm the current total.","Choose payment with stock briefly held"]]},{"id":"S13","name":"Choose payment with stock briefly held","role":"Customer","summary":"Pharmville checks available stock again and temporarily holds the items while the customer pays. Cash on delivery is offered only if eligible.","screen":"Final amount, delivery charges, online payment and eligible cash-on-delivery option.","system":"Hold the stock for a limited time; if it cannot be held, show an availability problem before taking payment.","next":"A valid stock hold exists and the customer selects a payment method.","edges":[["COD above cap / blocked for account","Explain why cash on delivery is unavailable and show approved online methods.","Choose payment with stock briefly held"],["Address or quantity edit","Recheck address, amount, stock and any P approval affected by the change.","Confirm what will actually be ordered; Review only the P medicines"],["Quote expired","Recalculate the total and ask for consent before starting payment.","Choose payment with stock briefly held"]]},{"id":"S14","name":"Pay online","role":"Customer / payment provider","summary":"The customer uses UPI, a card or another supported method. Pharmville must confirm payment with the payment provider, not merely trust the screen returning to the website.","screen":"Secure payment experience and exact payable amount.","system":"Treat repeated Pay clicks as the same attempt, and record the result only when verified.","next":"Payment succeeds, fails, or needs more time to confirm.","edges":[["Double click Pay","Use one payment attempt even if the customer taps Pay twice.","Pay online"],["Gateway request times out","Show Checking payment while Pharmville asks the provider for the real result.","Check a payment with an uncertain result"],["Amount changed in another tab","Ignore the old payment link and ask the customer to accept the current amount.","Choose payment with stock briefly held"]]},{"id":"S15","name":"Check a payment with an uncertain result","role":"Payment support","summary":"Sometimes the bank has charged the customer but the website has not received confirmation. Pharmville must investigate without asking the customer to pay twice.","screen":"Checking your payment. Please do not pay again yet.","system":"Check the payment provider and bank settlement records; resolve late or duplicate payments.","next":"The payment is confirmed, shown to have failed, or moved to support.","edges":[["Success webhook arrives twice","Record the bank confirmation once even when it arrives more than once.","Recognise paid or COD order"],["Customer charged but gateway callback missing","Keep the payment under investigation and tell the customer not to pay again.","Check a payment with an uncertain result; Investigate an unusual problem"],["Payment success arrives after cancel","Keep the order cancelled. Start a return of the money if the late charge succeeded.","Return the correct money once"],["Two independent payments succeeded","Keep only the amount that is actually owed and refund any extra payment.","Return the correct money once"]]},{"id":"S16","name":"Recognise paid or COD order","role":"Pharmville system / finance","summary":"An online payment is verified, or an eligible cash-on-delivery request is accepted. For COD, the cash has not been collected yet.","screen":"Payment successful, or Cash on delivery selected - pay when delivered.","system":"Record the correct payment arrangement once, then send the order for stock allocation.","next":"The order is sent to the fulfilment location decision.","edges":[["Partial online settlement only","Keep the payment pending until the expected amount is actually confirmed.","Check a payment with an uncertain result"],["Gateway succeeded for cancelled order","Do not restart a cancelled order. Return the unexpected payment.","Return the correct money once"],["COD eligibility revoked by fraud rule","Explain that COD cannot be used and ask the customer to select online payment or cancel.","Choose payment with stock briefly held; Cancel safely at the correct stage"]]},{"id":"S17","name":"Find a store with the full order","role":"Stock / operations team","summary":"Pharmville chooses a permitted store able to fulfil the accepted order. Under the proposed first-release rule, one order uses one selling/fulfilment location.","screen":"Finding a store and checking availability.","system":"Confirm exact quantities, correct packs and eligible batches; convert the short hold into a firm allocation.","next":"All accepted items have valid stock at an eligible location.","edges":[["Two checkout orders contend for last unit","Reserve the last unit for only one order; tell the other customer that it is unavailable.","Resolve a stock or delivery problem"],["Source POS Techsmith stock stale","Check the store’s real stock before confirming, because the shop system may be behind.","Resolve a stock or delivery problem"],["P lot expired/quarantined","Keep expired or blocked packs out of the order and look only for safe stock.","Resolve a stock or delivery problem"],["Warehouse cannot legally dispense order","Use another authorised location or stop the order. Stock alone is not permission to dispense.","Resolve a stock or delivery problem"]]},{"id":"S18","name":"Resolve a stock or delivery problem","role":"Customer / operations","summary":"If anything is unavailable or the promise changes, show which exact items are affected. Offer safe choices rather than silently changing medicines or charging a different amount.","screen":"Exact affected item, new estimated delivery time and options to Accept change, Wait if allowed or Cancel.","system":"Try an eligible location or the same exact SKU; request customer consent for removing lines and review for a different P medicine.","next":"A workable, customer-approved order exists, or cancellation/refund is started.","edges":[["M/O short in mixed basket","Show which M/O item is missing. Ask whether to remove it, wait or cancel; update the total.","Resolve a stock or delivery problem"],["P item out of stock; alternative proposed","Do not replace P with a lookalike. Any different medicine needs the proper approval and customer consent.","Review only the P medicines; Approve a changed basket"],["Customer not reachable","Keep the order on hold for the approved time, send a reminder, then follow the agreed cancellation policy.","Cancel safely at the correct stage; Return the correct money once"],["Promised delivery window missed","Tell the customer about the new delivery time and ask them to approve it if the change is significant.","Resolve a stock or delivery problem"]]},{"id":"S19","name":"Assign the order to a store","role":"Store / warehouse","summary":"Once all items are safely reserved, the selected store receives the confirmed order and its pick list.","screen":"Order confirmed - preparing at store.","system":"Assign one location and keep the reserved quantities available for that order.","next":"Store accepts the work and begins picking.","edges":[["Reservation TTL reaches limit before pick","If the hold is about to expire, refresh the stock allocation or return to the stock-problem step.","Find a store with the full order; Resolve a stock or delivery problem"],["Store closed unexpectedly","Reassign to an eligible open store if possible; otherwise contact the customer about the delay.","Find a store with the full order"],["Duplicate allocation event","Ignore the repeated assignment so two stores do not prepare the same order.","Assign the order to a store"]]},{"id":"S20","name":"Pick the exact ordered items","role":"Store team","summary":"A store worker picks the items by product, pack size and eligible batch. The worker checks strength and expiry, especially for P medicines.","screen":"Preparing your order.","system":"Scan and check each item. Never pack a different strength or unapproved P line.","next":"Every accepted item is checked and ready to pack.","edges":[["Wrong barcode / wrong strength","Stop picking the wrong product or strength and raise an item-check problem.","Fix a picking mistake or shortage"],["Damaged or expired pack found","Separate the damaged or expired pack, then look for a safe batch of the exact same product.","Fix a picking mistake or shortage"],["P line added after review","Do not add a P medicine without fresh pharmacist approval and customer agreement.","Review only the P medicines"],["Picked quantity differs from invoiced","Stop packing until picked quantities and the order record match.","Fix a picking mistake or shortage"]]},{"id":"S21","name":"Fix a picking mistake or shortage","role":"Store / operations","summary":"The shelf may not match the computer stock. The order pauses so the team can locate the correct item, request an approved change or cancel affected lines.","screen":"We are checking an item in your order.","system":"Check same item and batch availability; for product changes go back through customer agreement and P review where required.","next":"Correct items are found or the customer accepts a revised order.","edges":[["P alternative has similar ingredient","Do not treat similar ingredients as an approved substitute. Request proper review of any proposed different P item.","Review only the P medicines; Approve a changed basket"],["Partial quantity possible","Offer only the quantity permitted by the business policy and ask the customer to agree to the revised amount.","Resolve a stock or delivery problem"],["Missing shelf item due POS sync gap","Check the shelf and shop records, then correct stock only through authorised staff.","Resolve a stock or delivery problem"],["Customer cancels before pack commit","Confirm whether packing has started; if cancellation is still allowed, stop and return any payment.","Cancel safely at the correct stage"]]},{"id":"S22","name":"Check, invoice and seal the package","role":"Store quality / billing","summary":"Before packing, staff compare the picked items with the agreed order. The package is sealed and the proper invoice is prepared at the approved business point.","screen":"Packed and ready for pickup.","system":"Confirm prices, quantities, batch details and P approvals; stop any mismatch.","next":"The parcel passes final checks.","edges":[["Manifest includes unapproved P","Remove the unapproved P item from the pack and escalate the mistake to the pharmacy lead.","Review only the P medicines; Stop unsafe products immediately"],["Invoice amount mismatches payment","Stop the parcel. Correct the agreed total and invoice before dispatching.","Investigate an unusual problem"],["Printer unavailable","Use an approved backup invoice/label process or hold the parcel until documents are ready.","Check, invoice and seal the package"],["Packaging compromised","Repack and reseal. If tampering is suspected, follow the safety process.","Check, invoice and seal the package"]]},{"id":"S23","name":"Assign the rider and hand over the parcel","role":"Dispatch / rider","summary":"A delivery person is assigned. The store gives the correct sealed parcel to that person using a verified handover.","screen":"Ready for dispatch, then Rider picked up your order.","system":"Check the rider assignment, parcel identity and handover. If no rider is available, communicate a realistic delay.","next":"The rider has accepted the correct package.","edges":[["No rider capacity","Keep the parcel safe and give the customer a realistic update while a rider is arranged.","Assign the rider and hand over the parcel"],["Rider declines/loses network","Reassign the job or wait for a confirmed rider response; do not treat silence as pickup.","Assign the rider and hand over the parcel"],["Wrong parcel scanned","Do not hand over a parcel whose label does not match the order.","Check, invoice and seal the package"],["Order cancelled after handover request","Check if the parcel has actually left. Stop dispatch or begin return-to-store as appropriate.","Handle a failed delivery; Investigate an unusual problem"]]},{"id":"S24","name":"Travel to the delivery address","role":"Rider","summary":"The rider follows the delivery instructions. Tracking should show only reliable information rather than an invented live location.","screen":"Out for delivery, contact options and available ETA.","system":"Keep package custody recorded and flag accidents, delays or address issues.","next":"Rider arrives at the address or flags an unsuccessful attempt.","edges":[["Phone location permission denied","Deliver using reliable status milestones if live location is unavailable; do not invent rider coordinates.","Travel to the delivery address"],["Rider device offline","Save delivery actions safely and send them when connectivity returns without marking delivery twice.","Travel to the delivery address; Verify the recipient and hand over the order"],["Address incorrect mid-route","Confirm the address with the approved process; do not send the rider to a new address without checking serviceability.","Handle a failed delivery"],["Parcel tamper or accident","Stop delivery and report the damaged or unsafe parcel immediately.","Stop unsafe products immediately"]]},{"id":"S25","name":"Verify the recipient and hand over the order","role":"Rider / customer","summary":"The rider checks the required delivery proof, collects COD money if due, and hands over the correct sealed package.","screen":"Delivery code, final payable COD amount if applicable.","system":"Never mark delivered without valid proof. If cash, safety or proof is in doubt, pause the handover.","next":"Successful delivery proof and any due COD collection are recorded.","edges":[["Wrong OTP / customer unavailable","Limit incorrect code attempts and arrange another attempt or support if the recipient is unavailable.","Handle a failed delivery"],["COD amount disputed","Show the billed COD amount. If it is disputed, do not hand over until operations resolves it.","Handle a failed delivery; Investigate an unusual problem"],["Customer refuses altered/broken package","Record the refusal, keep custody of the parcel and start return and quality checks.","Handle a failed delivery; Stop unsafe products immediately"],["OTP service down","Use only an approved alternative proof method or contact support. Never pretend that an OTP was verified.","Verify the recipient and hand over the order; Investigate an unusual problem"]]},{"id":"S26","name":"Finish delivery and provide documents","role":"Customer / order support","summary":"After successful handover, the order shows Delivered and the customer can access the invoice, order history and help.","screen":"Delivered status, receipt/invoice, feedback and help options.","system":"Record delivery once and keep the history available for genuine complaints.","next":"Financial checks are completed or the customer opens an after-sales case.","edges":[["Rider submits proof twice","Keep one delivery confirmation, even if the rider submits proof again.","Finish delivery and provide documents"],["Customer says not received","Open an urgent delivery investigation and check the handover evidence.","Investigate an unusual problem"],["Late success after RTO confirmed","Flag contradictory updates for investigation; do not rewrite a confirmed return as delivered automatically.","Investigate an unusual problem"],["Incorrect delivered quantity","Open a missing-item case and check the pack and handover records.","Raise a return, wrong item or quality complaint; Investigate an unusual problem"]]},{"id":"S27","name":"Handle a failed delivery","role":"Rider / dispatch","summary":"If t ons","summary":"A recall, suspected incorrect medicine, damaged parcel or serious safety concern can stop picking, delivery or further sale at any point.","screen":"Clear safety guidance and a support channel, without exposing private health data.","system":"Block affected batches/orders, trace deliveries and follow the approved quality process.","next":"A qualified authority approves release, safe cancellation or recall/refund handling.","edges":[["Recall arrives while rider en route","Stop the rider before handover and return the parcel for a safety check.","Handle a failed delivery; Stop unsafe products immediately"],["Affected lot already delivered","Identify the affected orders by batch and contact customers through an approved pharmacy-led process.","Investigate an unusual problem; Stop unsafe products immediately"],["Non-affected items in mixed basket","Assess whether safe items may continue. Ask for customer agreement before changing the rest of the order.","Approve a changed basket; Resolve a stock or delivery problem"],["Quality user tries to clear with no evidence","Keep the block in place until a qualified, authorised person records the decision and evidence.","Stop unsafe products immediately"]]}],SCENARIOS=[{"id":"T1","name":"M + O: no prescription","desc":"Everyday checkout without pharmacist review","type":"MO","steps":["CUS01","CUS02","CUS03","CUS04","CUS05","CUS06","CUS12","CUS13","CUS15","INV02","STO01","STO03","STO05","STO06","RID02","RID03","RID04","RID05","CUS18"]},{"id":"T2","name":"P medicine approved","desc":"Upload, review, payment, store, rider","type":"P","steps":["CUS02","CUS03","CUS04","CUS05","CUS06","CUS07","CUS08","CUS09","PHM01","PHM02","PHM03","CUS12","CUS13","CUS15","INV02","STO01","STO03","STO04","STO05","STO06","RID03","RID04","RID05","CUS18"]},{"id":"T3","name":"P + M + O mixed basket","desc":"Only P goes to pharmacist","type":"PMO","steps":["CUS02","CUS03","CUS04","CUS05","CUS06","CUS07","CUS08","CUS09","PHM01","PHM02","PHM03" const GROUPS=[['CUS','Customer website'],['PHM','Pharmacist'],['STO','Store'],['INV','Inventory & warehouse'],['RID','Rider app'],['ADM','Admin & operations'],['FIN','Finance & support']];
const BYID=Object.fromEntries(SCREENS.map(s=>[s.id,s]));let view='journey',scenario='T3',cursor=0,selected='CUS04',role='ALL',query='',issueQuery='';
const $=q=>document.querySelector(q),escapeHTML=str=>String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function groupLabel(code){return GROUPS.find(g=>g[0]===code)?.[1]||code};function currentScenario(){return SCENARIOS.find(t=>t.id===scenario)};
function selectView(v){view=v;render()};function pickScenario(id){scenario=id;cursor=0;selected=currentScenario().steps[0];view='journey';render()};
function gotoScreen(id){if(!BYID[id])return;selected=id;view='screen';render()};function step(delta){const t=currentScenario();cursor=Math.min(t.steps.length-1,Math.max(0,cursor+delta));selected=t.steps[cursor];render()};
function thumb(s){let cls=s.pattern.startsWith('mobile')?'mobile':s.pattern==='split'?'split':'regular';return `<div class="thumb ${cls}"><div class="thumbbar" style="width:50%"></div><div class="thumbsplit"><div></div><div></div>${cls==='regular'?'<div></div>':''}</div><div class="thumbrow"></div><div class="thumbbar" style="width:78%"></div></div>`}
function row(label,second='',icon='▣'){return `<div class="demo-row"><div class="imgbox">${icon}</div><div class="line"><b>${escapeHTML(label)}</b><small>${escapeHTML(second)}</small></div><span class="type">›</span></div>`}
function field(label){return `<div class="faux-input">${escapeHTML(label)} <span style="float:right;color:#adb5c0">▾</span></div>`}
function fauxTable(lines){return `<table class="ui-table"><thead><tr><th>Item / reference</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody>${lines.map((x,i)=>`<tr><td>${escapeHTML(x.split(' / ')[0])}</td><td>${escapeHTML(x.split(' / ')[1]||'—')}</td><td><span class="chip">${i%2?'Review':'Ready'}</span></td><td>View →</td></tr>`).join('')}</tbody></table>`}
function mockContents(s){let a=s.sections,p=s.pattern;
const title=`<div class="micro">${escapeHTML(s.id)} / ${escapeHTML(groupLabel(s.role))}</div><h2>${escapeHTML(s.title)}</h2><div class="bodymuted" style="margin-bottom:17px">${escapeHTML(s.purpose)}</div>`;
if(p==='discovery')return title+`${field('Search medicines, healthcare and essentials')}<div class="ui-grid">${['Medicines','Personal care','Devices'].map((z,i)=>`<div class="ui-card"><div class="imgbox">${['✚','◌','▤'][i]}</div><b>${z}</b></div>`).join('')}</div><div class="panel"><h3>Featured categories</h3><div class="ui-grid two">${a.slice(2).map(z=>`<div class="ui-card">${escapeHTML(z)}</div>`).join('')}</div></div>`;
if(p==='catalogue')return title+`${field('Search: paracetamol')}<span class="faux-tab active">All</span><span class="faux-tab">In stock</span><span class="faux-tab">P / M / O</span><div class="ui-grid">${[['M','Non-prescription medicine'],['P','Prescription medicine'],['O','Personal care product']].map(([k,n])=>`<div class="ui-card"><div class="imgbox">▧</div><span class="type ${k}">${k}</span><br/><b>${n}</b><div class="greybar"></div><small class="bodymuted">View item →</small></div>`).join('')}</div>`;
if(p==='product')return title+`<div class="two-col"><div class="imgbox" style="min-height:240px">▧</div><div><h3>Sample medicine — exact pack</h3>${a.slice(1).map(z=>`<div class="mini">◻ ${escapeHTML(z)}</div>`).join('')}<div class="panel">${a[3]}</div><button class="screen-action">Add to cart</button></div></div>`;
if(p==='cart')return title+`${row('Sample P medicine','Prescription required','P')}${row('Sample M medicine','No prescription needed','M')}${row('Sample O product','No prescription needed','O')}<div class="panel"><b>Order summary</b><p class="bodymuted">${escapeHTML(a[3])}</p></div>`;
if(p==='form'||p==='address'||p==='payment'||p==='returns'||p==='support'||p==='mobile-form')return title+`${a.slice(0,3).map(z=>field(z)).join('')}<div class="panel">${escapeHTML(a[3])}</div>`;
if(p==='upload')return title+`<div class="panel">${escapeHTML(a[0])} · ${escapeHTML(a[1])}</div><div class="upload"><span style="font-size:29px">⇧</span><b>Choose a prescription file</b><small>${escapeHTML(a[2])}</small></div><div class="panel">${escapeHTML(a[3])}</div>`;
if(p==='status')return title+`<div class="panel"><h3>${escapeHTML(a[0])}</h3>${a.slice(1).map((z,i)=>`<div class="mini"><span class="step-num">${i+1}</span>${escapeHTML(z)}</div>`).join('')}</div>`;
if(p==='summary')return title+`${row('Delivery details',a[0],'⌖')}${row('Order items',a[1],'▣')}<div class="panel"><h3>Price breakdown</h3>${a.slice(2).map(z=>`<div class="mini">${escapeHTML(z)}</div>`).join('')}</div>`;
if(p==='orders'||p==='tracking')return title+`${a.map((z,i)=>`<div class="mini"><span class="step-num">${i+1}</span>${escapeHTML(z)}</div>`).join('')}<div class="panel">Order progress is updated after each confirmed handoff.</div>`;
if(p==='decision'||p==='exception'||p==='mobile-decision')return title+`<div class="note">${escapeHTML(a[0])}</div>${a.slice(1).map(z=>`<div class="panel">${escapeHTML(z)}</div>`).join('')}`;

if(p==='checklist'||p==='mobile-check'||p==='handover')return title+`${a.map(z=>`<div class="demo-row"><span class="checkbox"></span><div class="line"><b>${escapeHTML(z)}</b></div></div>`).join('')}`;
if(p==='dashboard')return title+`<div class="ui-grid">${a.slice(0,3).map((z,i)=>`<div class="ui-card"><div class="micro">Metric ${i+1}</div><strong style="display:block;font-size:23px;color:#647488">—</strong><b>${escapeHTML(z)}</b></div>`).join('')}</div><div class="panel" style="min-height:100px">${escapeHTML(a[3])}</div>`;
if(p.startsWith('mobile'))return title+`${a.map((z,i)=>`<div class="demo-row"><div class="imgbox">${['▣','⌖','◴','✓'][i]}</div><div class="line"><b>${escapeHTML(z)}</b></div></div>`).join('')}`;
if(p==='detail')return title+`${a.map((z,i)=>`<div class="panel"><b>${String(i+1).padStart(2,'0')} ·</b> ${escapeHTML(z)}</div>`).join('')}`;
return title+`${a.map(z=>`<div class="panel">${escapeHTML(z)}</div>`).join('')}`;
}
function mock(s){const mobile=s.pattern.startsWith('mobile'),staff=s.role!=='CUS'&&!mobile;const content=`${mockContents(s)}<button class="screen-action" data-action="mock">${escapeHTML(s.action)} →</button>`;
if(mobile)return `<div class="wire"><div class="phone"><div class="phone-head">‹ &nbsp; Pharmville Rider <span style="float:right">◉</span></div><div class="phone-body">${content}</div></div></div>`;
if(staff)return `<div class="wire"><div class="mock"><div class="mock-header"><div class="mock-logo"><i>+</i> Pharmville / ${escapeHTML(groupLabel(s.role))}</div><div class="mock-nav">Notifications &nbsp; Help &nbsp; Profile</div></div><div class="mock-layout"><div class="mock-side"><strong>${escapeHTML(groupLabel(s.role))}</strong><div class="sel">Overview</div><div>Orders</div><div>Review queue</div><div>Reports</div><div>Settings</div></div><div class="mock-body">${content}</div></div></div></div>`;
return `<div class="wire"><div class="mock"><div class="mock-header"><div class="mock-logo"><i>+</i> pharmville</div><div class="mock-nav">Medicines &nbsp; Personal Care &nbsp; My Orders &nbsp; Cart</div></div><div class="mock-body">${content}</div></div></div>`;
}
function header(title,sub,metric=''){return `<div class="intro"><div><span class="eyebrow">Pharmville · Low-fidelity wireframes</span><h1>${escapeHTML(title)}</h1><p>${escapeHTML(sub)}</p></div><div class="metrics"><span>60 screens</span><span>7 areas</span><span>34 mapped states</span>${metric?`<span>${metric}</span>`:''}</div></div>`}
function aside(s){return `<div class="sheet aside"><div class="sidepiece"><h3>What this screen achieves</h3><p>${escapeHTML(s.purpose)}</p><span class="chip">${escapeHTML(s.id)} · ${escapeHTML(groupLabel(s.role))}</span></div><div class="sidepiece"><h3>Important action</h3><p class="whatnext">${escapeHTML(s.action)}</p><h3 style="margin-top:17px">Where it goes next</h3>${s.next.map(n=>`<button class="route-btn" data-open="${n}">${n} · ${escapeHTML(BYID[n].title)}</button>`).join('')}</div><div class="sidepiece"><h3>Traceability</h3><p class="muted">Based on journey ${s.states.join(', ')}. Relevant edge cases are kept in a separate tab.</p><button class="btn ghost small" data-issues="${s.id}">See problems for this screen →</button></div></div>`}
function stage(s,scenarioCtx=false){const t=currentScenario();return `<div class="workspace"><div class="sheet"><div class="sectiontop"><div><strong>${escapeHTML(s.title)}</strong><div class="focus-title">${s.id} · ${escapeHTML(groupLabel(s.role))}</div></div><span class="chip">${s.states.join(', ')}</span></div>${scenarioCtx?`<div class="progress"><i style="width:${Math.round((cursor+1)/t.steps.length*100)}%"></i></div>`:''}${mock(s)}<div class="nextbar">${scenarioCtx?`<div><button class="btn ghost small" data-step="-1" ${cursor===0?'disabled':''}>← Previous</button><button class="btn small" data-step="1" ${cursor===t.steps.length-1?'disabled':''}>Next step →</button></div><span class="muted">Step ${cursor+1} of ${t.steps.length}</span>`:`<span class="muted">Low-fidelity example · no live orders or payments</span><button class="btn ghost small" data-library="1">All screens →</button>`}</div></div>${aside(s)}</div>`}
function renderJourney(){let t=currentScenario(),s=BYID[t.steps[cursor]];return `${header(t.name,t.desc,'12 guided journeys')}<div class="library-toolbar"><select id="scenario-select" class="scenario-picker">${SCENARIOS.map(z=>`<option value="${z.id}" ${z.id===t.id?'selected':''}>${escapeHTML(z.name)}</option>`).join('')}</select></div>${stage(s,true)}`}
function renderScreen(){let s=BYID[selected];return `${header('Screen detail','A working low-fidelity wireframe with the primary action and relevant handoffs.')}${stage(s,false)}`}
function renderLibrary(){let items=SCREENS.filter(s=>(role==='ALL'||s.role===role)&&(s.id+' '+s.title+' '+s.purpose).toLowerCase().includes(query.toLowerCase()));return `${header('All 60 screens','Browse real screen structures by product area. Open a frame to inspect its purpose, action, and destination.')}
<div class="library-toolbar"><input type="search" id="screen-search" placeholder="Search screen title, ID or purpose…" value="${escapeHTML(query)}"><select id="role-select"><option value="ALL">All product areas</option>${GROUPS.map(([k,v])=>`<option value="${k}" ${role===k?'selected':''}>${escapeHTML(v)}</option>`).join('')}</select></div><div class="library-grid">${items.map(s=>`<button class="screen-tile" data-open="${s.id}">${thumb(s)}<small>${s.id} · ${escapeHTML(groupLabel(s.role))}</small><strong>${escapeHTML(s.title)}</strong><p>${escapeHTML(s.purpose)}</p></button>`).join('')}</div>${items.length?'':'<div class="empty">No matching screens.</div>'}`}
function renderIssues(){const all=STATES.flatMap(st=>st.edges.map((e,i)=>({state:st.id,stateTitle:st.name,trigger:e[0],response:e[1],destination:e[2],key:st.id+'-'+i})));let matches=all.filter(e=>(e.trigger+' '+e.response+' '+e.state+' '+e.stateTitle).toLowerCase().includes(issueQuery.toLowerCase()));return `${header('When something goes wrong','Separate from the UI. Every issue shows what happened and the recommended next action in simple English.','126 source edge cases')}<div class="library-toolbar"><input type="search" id="issue-search" placeholder="Search e.g. payment, P rejected, stock, OTP…" value="${escapeHTML(issueQuery)}"></div>${matches.map(e=>`<div class="issue-card"><h3>${escapeHTML(e.trigger)} <span class="chip">${e.state}</span></h3><div class="issue-grid"><div><b>At this step</b><p>${escapeHTML(e.stateTitle)}</p></div><div><b>What Pharmville should do</b><p>${escapeHTML(e.response)}</p></div><div><b>Next step</b><p>${escapeHTML(e.destination)}</p></div></div></div>`).join('')}${!matches.length?'<div class="empty">No matching issues.</div>':''}`}
function renderHandoffs(){return `${header('Role handoffs','Who acts next, and why. This page is intentionally simpler than a technical state diagram.')}<div class="handoffs">${[['1 · Customer','Choose items and address, add patient/Rx only when P exists.','CUS04'],['2 · Pharmacist (P only)','Review only active P lines. M and O never create a review task.','PHM02'],['3 · Payment and stock','Verify receipt or COD and reserve an eligible item at the right store.','CUS13'],['4 · Store','Pick the exact item, check batch, seal and invoice.','STO03'],['5 · Rider','Accept parcel, navigate, verify recipient, complete or report failure.','RID03'],['6 · Finance','Investigate unmatched payment, COD differences and refunds.','FIN03'],['7 · Support','Handle customer decisions after stock shortage or safety problem.','FIN07'],['8 · Admin','Supervise queues, permissions, catalogue rules and exceptional cases.','ADM06']].map(([a,b,c])=>`<button class="handoff" data-open="${c}"><b>${a}</b><p>${b}</p><span class="chip">View ${c} →</span></button>`).join('')}</div><div class="note" style="margin-top:20px"><b>Safety rules:</b> P items must be approved before fulfilment. M/O items never independently require pharmacist review. Rejected P items never disappear from a payable basket without the customer's agreement. Do not charge twice for uncertain payments. Never replace a medicine without the required approval.</div>`}
function renderAbout(){return `${header('How to use this package','A wireframe is a planning and review tool. It is not a live shopping website.')}
<div class="sheet sheet-pad"><h2>Recommended review order</h2><ol><li>Open <b>Guided journey</b> → M + O, then P approved, then one P rejected.</li><li>Open <b>All screens</b> to see every role and page.</li><li>Open <b>When something goes wrong</b> to check how the platform recovers.</li><li>Review the Word specification for all 60 screen contracts.</li><li>Mark the Excel checklist as Approved, Changes Needed, or Blocked.</li></ol><h3>What is intentionally outside the screen</h3><p>The full 126 edge cases, technical API/database implementation, privacy/legal approvals, and unresolved policy settings belong in supporting documents, not inside the shopping UI.</p><h3>Known business decisions to confirm</h3><p>Payment timing for P orders is proposed as after clinical approval. Stock hold duration, prescription correction deadline, seller/licensing rules, return eligibility, COD limits, and delivery attempts need owners to confirm values before implementation.</p><h3>Accessibility and content rules</h3><p>Real build needs keyboard navigation, readable labels, error messages beside relevant fields, sufficient contrast, form validation and an accessible mobile layout. These wireframes illustrate content structure, not final visual design.</p></div>`}
function render(){document.querySelectorAll('.nav-btn').forEach(e=>e.classList.toggle('active',e.dataset.view===view));let out=view==='journey'?renderJourney():view==='screen'?renderScreen():view==='library'?renderLibrary():view==='issues'?renderIssues():view==='handoffs'?renderHandoffs():renderAbout();$('#app').innerHTML=out;$('#crumb').innerHTML=view==='journey'?'Guided journeys':view==='screen'?`Screen ${selected}`:view==='library'?'Screen library':view==='issues'?'Edge cases':view==='handoffs'?'Handoffs':'Read me';document.querySelectorAll('.scenario-btn').forEach(e=>e.classList.toggle('active',e.dataset.scenario===scenario));}
document.addEventListener('click',e=>{let a=e.target.closest('[data-view]');if(a){selectView(a.dataset.view);return}a=e.target.closest('[data-scenario]');if(a){pickScenario(a.dataset.scenario);return}a=e.target.closest('[data-step]');if(a){step(Number(a.dataset.step));return}a=e.target.closest('[data-open]');if(a){gotoScreen(a.dataset.open);return}a=e.target.closest('[data-issues]');if(a){issueQuery=BYID[a.dataset.issues].states.join(' ').split(' ')[0];selectView('issues');return}a=e.target.closest('[data-library]');if(a){selectView('library');return}a=e.target.closest('[data-action]');if(a){const s=BYID[selected];const t=currentScenario();if(view==='journey'){step(1)}else if(s.next[0])gotoScreen(s.next[0]);return}});
document.addEventListener('change',e=>{if(e.target.id==='scenario-select')pickScenario(e.target.value);if(e.target.id==='role-select'){role=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='screen-search'){query=e.target.value;const pos=e.target.selectionStart;render();const t=$('#screen-search');t.focus();t.setSelectionRange(pos,pos)}if(e.target.id==='issue-search'){issueQuery=e.target.value;const pos=e.target.selectionStart;render();const t=$('#issue-search');t.focus();t.setSelectionRange(pos,pos)}});
render();</script></body></html>
