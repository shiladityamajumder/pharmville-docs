<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Pharmville interactive low-fidelity product wireframes. Synthetic local demonstration only.">
  <title>Pharmville · Wireframe Explorer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/experience.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/product-ux.css">
  <link rel="stylesheet" href="assets/css/experience-choice.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to screen content</a>
  <div class="demo-banner">Fictional Pharmville demonstration</div>
  <header class="global-header">
    <a class="wordmark" href="#/" aria-label="Explore Pharmville">PHARMVILLE</a>
    <nav class="product-nav" id="product-nav" aria-label="Pharmville navigation" hidden></nav>
    <nav class="prototype-nav" aria-label="Prototype controls"><a href="#/">Explore</a><button data-action="shell.review.open" class="quiet">Review tools</button></nav>
  </header>
  <div id="app"><main id="main"><h1>Loading the wireframe explorer…</h1><p>Run this folder with the local preview server so JavaScript modules can load.</p></main></div>
  <div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="actions"><button value="cancel" autofocus>Keep current data</button><button id="dialog-confirm" value="confirm" class="primary">Confirm</button></div></form></dialog>
  <dialog id="journey-start-dialog" class="journey-start-dialog" aria-labelledby="journey-start-title"><div class="review-head"><div><p class="eyebrow">Guided walkthrough</p><h2 id="journey-start-title">Start this journey</h2></div><button type="button" class="quiet" data-action="shell.journey.start.close" aria-label="Close journey setup">Close</button></div><p id="journey-start-description"></p><div class="fixture-choices"><button type="button" data-action="shell.journey.start.current">Use my current demo data<span>Keep the order, steps and records already in this browser.</span></button><button type="button" class="primary" data-action="shell.journey.start.fixture">Load prepared demo data<span>This replaces current demo progress after one confirmation. No real actions occur.</span></button></div></dialog>
  <dialog id="review-dialog" class="review-dialog" aria-labelledby="review-title"><div class="review-head"><div><p class="eyebrow">Separate reviewer workspace</p><h2 id="review-title">Review tools</h2></div><button type="button" class="quiet" data-action="shell.review.close" aria-label="Close review tools">Close</button></div><div id="review-panel-content"></div></dialog>
  <noscript><p class="notice">Enable JavaScript for the local interactive prototype. The documentation can still be read without it.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
